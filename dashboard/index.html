<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Live Console</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap">
<style>
:root{
  --ground:#F5F7F9;--surface:#fff;--surface-2:#EDF1F5;--ink:#151A21;--ink-2:#3A4452;
  --muted:#5F6B7A;--rule:#D9DFE6;--accent:#27548A;--done:#2E6B4F;--warn:#8C3A2E;
  --named:#2a78d6;--disguised:#eb6834;--grid:#E4E9EE;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ground:#11141A;--surface:#181D25;--surface-2:#1F252F;--ink:#E9EDF3;--ink-2:#BFC8D4;
  --muted:#94A0B0;--rule:#2A313C;--accent:#7FA8DA;--done:#6FBF95;--warn:#D98878;
  --named:#3987e5;--disguised:#d95926;--grid:#2A313C;
}}
:root[data-theme="dark"]{
  --ground:#11141A;--surface:#181D25;--surface-2:#1F252F;--ink:#E9EDF3;--ink-2:#BFC8D4;
  --muted:#94A0B0;--rule:#2A313C;--accent:#7FA8DA;--done:#6FBF95;--warn:#D98878;
  --named:#3987e5;--disguised:#d95926;--grid:#2A313C;
}
*{box-sizing:border-box}
body{margin:0;background:var(--ground);color:var(--ink);
  font-family:"IBM Plex Sans",system-ui,sans-serif;font-size:15px;line-height:1.55}
.wrap{max-width:1080px;margin:0 auto;padding:22px 20px 70px}
header{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;
  padding-bottom:14px;border-bottom:2px solid var(--ink);margin-bottom:22px}
h1{font-family:"Source Serif 4",Georgia,serif;font-size:1.6rem;font-weight:700;margin:0;letter-spacing:-.02em}
.tick{font-family:"IBM Plex Mono",monospace;font-size:11px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--muted);margin-left:auto}
.pulse{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--done);margin-right:7px}
.pulse.busy{background:var(--warn);animation:b 1.1s infinite}
@keyframes b{50%{opacity:.25}}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.card{background:var(--surface);border:1px solid var(--rule);border-radius:2px;padding:18px 20px}
.card.wide{grid-column:1/-1}
h2{font-family:"IBM Plex Mono",monospace;font-size:10.5px;letter-spacing:.13em;
  text-transform:uppercase;color:var(--muted);margin:0 0 14px;font-weight:500;
  display:flex;align-items:center;gap:9px}
h2::after{content:"";flex:1;height:1px;background:var(--rule)}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{text-align:left;padding:7px 10px;border-bottom:1px solid var(--rule)}
th{font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--muted);font-weight:500}
td.n{font-family:"IBM Plex Mono",monospace;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
tr:last-child td{border-bottom:none}
.sw{width:9px;height:9px;border-radius:2px;display:inline-block;margin-right:7px}
.mono{font-family:"IBM Plex Mono",monospace;font-size:.83rem}
.dim{color:var(--muted)}
.big{font-family:"IBM Plex Mono",monospace;font-size:1.9rem;font-weight:500;line-height:1;font-variant-numeric:tabular-nums}
.v{display:inline-block;padding:1px 6px;border-radius:2px;font-family:"IBM Plex Mono",monospace;font-size:9.5px;letter-spacing:.06em}
.v.AT_EQUILIBRIUM{background:rgba(46,107,79,.14);color:var(--done)}
.v.STRATEGIC_GAP{background:rgba(235,104,52,.16);color:var(--disguised)}
.v.COMPETENCE_GAP{background:rgba(140,58,46,.14);color:var(--warn)}
.v.PARSE_FAIL,.v.PROBE_FORMAT_FAIL{background:var(--surface-2);color:var(--muted)}
.legend{display:flex;gap:16px;margin-bottom:12px;font-family:"IBM Plex Mono",monospace;
  font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center}
svg text{font-family:"IBM Plex Mono",monospace;fill:var(--muted)}
svg .val{fill:var(--ink);font-weight:500}
svg .gl{fill:var(--ink-2);font-family:"IBM Plex Sans",sans-serif}
.idle{color:var(--muted);font-style:italic;font-size:.9rem}
@media (max-width:760px){.grid{grid-template-columns:1fr}}
</style>

<div class="wrap">
  <header>
    <h1>Live Console</h1>
    <span class="mono dim" id="sub">Equilibrium or Retrieval</span>
    <span class="tick"><span class="pulse" id="pulse"></span><span id="tick">connecting…</span></span>
  </header>

  <div class="grid">
    <div class="card"><h2>Running now</h2><div id="procs"></div></div>
    <div class="card"><h2>Repo</h2><div id="repo"></div></div>
    <div class="card wide"><h2>Equilibrium play by framing</h2>
      <div class="legend">
        <span><i class="sw" style="background:var(--named)"></i>Named</span>
        <span><i class="sw" style="background:var(--disguised)"></i>Disguised</span>
      </div>
      <div style="overflow-x:auto"><svg id="chart" viewBox="0 0 900 260" width="900" height="260" role="img"></svg></div>
    </div>
    <div class="card wide"><h2>Cells <span id="runname" class="mono dim" style="text-transform:none;letter-spacing:0"></span></h2><div id="cells"></div></div>
    <div class="card"><h2>Last 12 trials</h2><div id="recent"></div></div>
    <div class="card"><h2>Commits</h2><div id="commits"></div></div>
    <div class="card wide"><h2>Modules</h2><div id="modules"></div></div>
  </div>
</div>

<script>
const GAMES = ["vickrey","cournot","repeated_pd","public_goods"];
const NICE = {vickrey:"Vickrey",cournot:"Cournot",repeated_pd:"Repeated PD",public_goods:"Public goods"};
const esc = s => String(s??"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));

function chart(cells){
  const W=900,H=260,top=26,bot=54,L=62;
  const groupW=(W-L-20)/GAMES.length, barW=40, h=H-top-bot;
  let g=`<g stroke="var(--grid)" stroke-width="1">`;
  for(let i=0;i<=4;i++){const y=top+h-(h*i/4);g+=`<line x1="${L}" y1="${y}" x2="${W-14}" y2="${y}"/>`}
  g+=`</g><g font-size="9.5" text-anchor="end">`;
  for(let i=0;i<=4;i++){const y=top+h-(h*i/4);g+=`<text x="${L-8}" y="${y+3}">${i*25}%</text>`}
  g+=`</g>`;
  GAMES.forEach((game,gi)=>{
    const x0=L+gi*groupW+groupW/2-barW-3;
    ["named","disguised"].forEach((fr,fi)=>{
      const c=cells.find(c=>c.game===game&&c.framing===fr);
      const x=x0+fi*(barW+6);
      if(!c){g+=`<rect x="${x}" y="${top}" width="${barW}" height="${h}" fill="var(--surface-2)" stroke="var(--rule)" stroke-dasharray="3 3"/>`;return}
      const bh=Math.max(3,h*c.at_eq_pct/100), y=top+h-bh;
      g+=`<rect x="${x}" y="${y}" width="${barW}" height="${bh}" rx="4" fill="var(--${fr})"><title>${NICE[game]}, ${fr}: ${c.at_eq} of ${c.n} at equilibrium (${c.at_eq_pct}%)</title></rect>`;
      g+=`<text class="val" x="${x+barW/2}" y="${y-6}" font-size="10" text-anchor="middle">${c.at_eq_pct}%</text>`;
    });
    g+=`<text class="gl" x="${L+gi*groupW+groupW/2}" y="${H-32}" font-size="11" text-anchor="middle">${NICE[game]}</text>`;
  });
  document.getElementById("chart").innerHTML=g;
}

function render(s){
  const busy=s.processes.length>0;
  document.getElementById("pulse").className="pulse"+(busy?" busy":"");
  document.getElementById("tick").textContent=(busy?"running · ":"idle · ")+new Date().toLocaleTimeString();

  document.getElementById("procs").innerHTML = busy
    ? `<table><tr><th>pid</th><th>elapsed</th><th>cpu</th><th>command</th></tr>`+
      s.processes.map(p=>`<tr><td class="mono">${esc(p.pid)}</td><td class="mono">${esc(p.elapsed)}</td><td class="n">${esc(p.cpu)}%</td><td class="mono dim">${esc(p.cmd)}</td></tr>`).join("")+`</table>`
    : `<div class="idle">No experiment running.</div>`;

  const run=s.runs[0]||{cells:[],recent:[],trials:0};
  document.getElementById("runname").textContent=run.name?`— ${run.name}`:"";
  document.getElementById("repo").innerHTML=
    `<div class="big">${run.trials}</div><div class="mono dim" style="margin-bottom:12px">trials in latest run${run.median_latency?` · median ${run.median_latency}s`:""}</div>`+
    `<table><tr><td>Modules</td><td class="n">${s.modules.length}</td></tr>`+
    `<tr><td>Lines of code</td><td class="n">${s.module_lines}</td></tr>`+
    `<tr><td>Commits</td><td class="n">${s.commits.length>=12?"12+":s.commits.length}</td></tr>`+
    `<tr><td>Runs on disk</td><td class="n">${s.runs.length}</td></tr></table>`;

  chart(run.cells);

  document.getElementById("cells").innerHTML=
    `<table><tr><th>Game</th><th>Framing</th><th style="text-align:right">n</th><th style="text-align:right">At eq.</th><th style="text-align:right">Mean dev</th><th style="text-align:right">SD</th><th>Verdicts</th></tr>`+
    run.cells.map(c=>`<tr><td>${NICE[c.game]||esc(c.game)}</td>`+
      `<td><i class="sw" style="background:var(--${c.framing})"></i>${esc(c.framing)}</td>`+
      `<td class="n">${c.n}</td><td class="n">${c.at_eq_pct}%</td>`+
      `<td class="n">${c.mean===null?"—":(c.mean>0?"+":"")+c.mean}</td><td class="n">${c.sd}</td>`+
      `<td>${Object.entries(c.verdicts).map(([k,v])=>`<span class="v ${esc(k)}">${v} ${esc(k.replace("_GAP","").replace("AT_EQUILIBRIUM","EQ"))}</span>`).join(" ")}</td></tr>`).join("")+`</table>`;

  document.getElementById("recent").innerHTML=
    `<table>`+run.recent.map(r=>`<tr><td>${NICE[r.game]||esc(r.game)}</td><td class="mono dim">${esc(r.framing)}</td>`+
      `<td class="n">${esc(r.dev)}</td><td><span class="v ${esc(r.verdict)}">${esc((r.verdict||"").replace("_GAP","").replace("AT_EQUILIBRIUM","EQ"))}</span></td>`+
      `<td class="n dim">${esc(r.latency)}s</td></tr>`).join("")+`</table>`;

  document.getElementById("commits").innerHTML=
    `<table>`+s.commits.map(c=>`<tr><td class="mono" style="color:var(--accent)">${esc(c.hash)}</td>`+
      `<td>${esc(c.subject).slice(0,52)}</td><td class="n dim">${esc(c.when)}</td></tr>`).join("")+`</table>`;

  document.getElementById("modules").innerHTML=
    `<table><tr><th>File</th><th style="text-align:right">Lines</th><th>File</th><th style="text-align:right">Lines</th></tr>`+
    s.modules.reduce((rows,m,i)=>{ if(i%2===0)rows.push([m]); else rows[rows.length-1].push(m); return rows},[])
      .map(pair=>`<tr>`+pair.map(m=>`<td class="mono">${esc(m.path)}</td><td class="n">${m.lines}</td>`).join("")+
        (pair.length===1?`<td></td><td></td>`:``)+`</tr>`).join("")+`</table>`;
}

async function poll(){
  try{ render(await (await fetch("/api/state",{cache:"no-store"})).json()); }
  catch(e){ document.getElementById("tick").textContent="server not reachable"; }
}
poll(); setInterval(poll, 2500);
</script>
